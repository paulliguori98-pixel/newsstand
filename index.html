<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Today's Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..600;1,6..72,300..500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --wash:#F7F6F3; --ink:#16181B; --muted:#7A7F85;
  --hair:#E7E5E1; --faint:#F2F0EC; --accent:#2B4A6F;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Jost","Helvetica Neue",system-ui,sans-serif;
  --page:1080px; --text:660px; --soft:6px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.55;font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:3px}
img{border-radius:var(--soft)}
.page{max-width:var(--page);margin:0 auto;padding:0 2rem 5rem}
.label{font-family:var(--sans);font-weight:500;font-size:.62rem;letter-spacing:.19em;text-transform:uppercase;color:var(--accent)}

.masthead{text-align:center;padding:3.6rem 0 0}
.masthead .kicker{font-family:var(--sans);font-weight:400;font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
.masthead .date{font-family:var(--serif);font-weight:300;font-size:clamp(2.1rem,5.4vw,3.3rem);line-height:1.06;letter-spacing:-.018em;margin:.75rem 0 0}
.masthead .date em{font-style:italic;font-weight:200}
.masthead .tally{font-family:var(--sans);font-weight:300;font-size:.72rem;letter-spacing:.05em;color:var(--muted);margin-top:.7rem}
.tabs{display:flex;gap:1.6rem;justify-content:center;margin:1.5rem 0 0}
.tabs a{font-family:var(--sans);font-weight:400;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding-bottom:.4rem;border-bottom:1px solid transparent;transition:all .2s}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}

.edition-rule{display:flex;gap:5px;height:3px;margin:2rem auto 0;max-width:var(--text)}
.edition-rule a{background:var(--hair);border-radius:99px;position:relative;overflow:hidden;transition:opacity .2s}
.edition-rule a::after{content:"";position:absolute;inset:0;background:var(--accent);border-radius:99px;transform:scaleX(var(--read,0));transform-origin:left;transition:transform .4s cubic-bezier(.4,0,.2,1)}

.section{padding-top:3rem}
.section-head{display:flex;align-items:center;gap:1.1rem;max-width:var(--text);margin:0 auto 1.4rem}
.section-head::before,.section-head::after{content:"";flex:1;height:1px;background:var(--hair)}
.section-head span{font-family:var(--sans);font-weight:400;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.section.wide .section-head{max-width:none}
.stories{max-width:var(--text);margin:0 auto}

/* The lead: one per section, the top-scoring story. Sized to be obviously
   the most important thing without shouting. */
.lead{display:block;padding-bottom:1.1rem;border-bottom:1px solid var(--ink)}
.lead h3{font-weight:400;font-size:clamp(1.5rem,3vw,2rem);line-height:1.16;letter-spacing:-.015em;margin:.4rem 0 .4rem}
.lead p{margin:0;color:var(--muted);font-weight:300;font-size:.98rem;line-height:1.5}
.lead .hero{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;margin:0 0 .9rem;background:var(--wash)}
.lead:hover h3{color:var(--accent)}
.weight{font-family:var(--sans);font-weight:300;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:.5rem}
.cites{font-family:var(--sans);font-weight:400;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 .15rem}

/* Everything else: one line, no dek, no thumbnail. This is what stops the
   page being something you scroll through for a minute. */
.row{display:block;padding:.72rem 0;border-bottom:1px solid var(--faint)}
.row:last-child{border-bottom:none}
.row h3{font-weight:400;font-size:1.02rem;line-height:1.34;letter-spacing:-.005em;margin:.15rem 0 0;display:inline}
.row .label{font-size:.57rem;display:block;margin-bottom:.1rem}
.row:hover h3{color:var(--accent)}
.row.rich{display:flex;gap:.85rem;align-items:flex-start}
.row .rowtext{min-width:0}
.thumb{flex:none;width:96px;height:54px;border-radius:5px;background:var(--wash);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rowdek{margin:.14rem 0 0;color:var(--muted);font-weight:300;font-size:.82rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}  
.tick{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--accent);vertical-align:.28em;margin-left:.45rem}

.almanac{display:flex;align-items:center;gap:1.15rem;max-width:var(--text);margin:0 auto;background:#F1F5FA;border-radius:10px;padding:1.05rem 1.3rem}
.almanac .deg{flex:none;font-weight:200;font-size:2.35rem;line-height:.95;letter-spacing:-.02em}
.almanac .say{margin:0;font-weight:300;font-size:1rem;line-height:1.45}
.almanac .sayhi{display:block;font-weight:400}
.almanac .saylo{display:block;color:#7A8792;font-size:.78rem;margin-top:.2rem}
@media (max-width:430px){.almanac{gap:.9rem;padding:.9rem 1rem}.almanac .deg{font-size:2rem}}

.goods{display:grid;grid-template-columns:repeat(2,1fr);gap:2.2rem 1.6rem;max-width:var(--text);margin:0 auto}
.good{text-align:center}
.good .frame{background:var(--wash);border-radius:var(--soft);overflow:hidden}
.good img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.good:hover img{transform:scale(1.03)}
.good .label{display:block;margin:.85rem 0 .25rem;font-size:.58rem}
.good h3{font-weight:400;font-size:.95rem;line-height:1.3;margin:0 0 .2rem}
.good .price{font-family:var(--sans);font-weight:300;font-size:.8rem;color:var(--muted)}
.filler .frame{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.85rem;aspect-ratio:4/5;padding:1.3rem;background:transparent;border:1px solid var(--hair)}
.filler p{margin:0;font-weight:300;font-size:1.02rem;line-height:1.35;color:var(--ink)}
.filler span{font-family:var(--sans);font-weight:400;font-size:.6rem;letter-spacing:.17em;text-transform:uppercase;color:var(--accent)}
.filler:hover span{color:var(--ink)}
.more{display:block;max-width:var(--text);margin:1.3rem auto 0;padding:.3rem 0;text-align:center;font-family:var(--sans);font-weight:300;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.more:hover{color:var(--ink)}
.empty + .more{margin-top:0}

.kick{font-family:var(--sans);font-weight:400;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
.task{font-weight:400;font-size:1.3rem;line-height:1.18;letter-spacing:-.01em;margin:0 0 .35rem}
.taskdek{margin:0 0 1rem;color:var(--muted);font-weight:300;font-size:.88rem;line-height:1.45}
.plantbox{display:flex;gap:.8rem;align-items:flex-start;background:var(--wash);border-radius:8px;padding:.9rem 1.05rem;margin-bottom:.5rem}
.plantbox svg{flex:none;margin-top:.15rem;fill:none;stroke:var(--accent);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.plabel{font-family:var(--sans);font-weight:500;font-size:.53rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:.2rem}
.crops{font-size:.9rem;line-height:1.4}
.reading{border-top:1px solid var(--ink);margin-top:1rem}
  
.empty{color:var(--muted);font-weight:300;font-size:.95rem;max-width:var(--text);margin:0 auto;text-align:center;padding:1.2rem 0}
.colophon{max-width:var(--text);margin:4.5rem auto 0;padding-top:1.4rem;border-top:1px solid var(--hair);text-align:center;font-family:var(--sans);font-weight:300;font-size:.7rem;letter-spacing:.06em;color:var(--muted)}
.colophon details{margin-top:.6rem}
.colophon summary{cursor:pointer}
.colophon ul{list-style:none;margin:.6rem 0 0;padding:0;line-height:1.8}

@media (max-width:640px){
  .page{padding:0 1.25rem 3.5rem}
  .masthead{padding-top:2.4rem}
  .section{padding-top:2.4rem}
  .goods{grid-template-columns:repeat(2,1fr);gap:1.8rem 1rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="kicker">Today's Edition</div>
    <h1 class="date" id="date"></h1>
    <div class="tally" id="tally"></div>
    <nav class="tabs"><a href="index.html" class="on">Today</a><a href="all.html">All releases</a></nav>
    <nav class="edition-rule" id="rule" aria-label="Sections in today's edition"></nav>
  </header>

  <main id="edition"></main>

  <footer class="colophon">
    <div>Rebuilt through the day. Built for one reader. · <a href="all.html">All releases</a></div>
    <div id="errors"></div>
  </footer>
</div>

<script src="data/feed.js"></script>
<script>
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

const linkTo = (item, cls) => {
  const a = el("a", cls);
  a.href = item.url || "#";
  a.target = "_blank";
  a.rel = "noopener";
  return a;
};

// Some feeds hand over a 150px thumbnail. Rather than smear it across a
// hero slot, drop it — a missing photo reads better than a blurred one.
function guardImage(img, minWidth, onFail) {
  img.addEventListener("error", onFail);
  img.addEventListener("load", () => {
    if (img.naturalWidth && img.naturalWidth < minWidth) onFail();
  });
}
  
function leadCard(item, withImage) {
  const a = linkTo(item, "lead");
  if (withImage && item.image) {
    const img = el("img", "hero");
    img.src = item.image;
    img.alt = "";
    img.loading = "lazy";
    guardImage(img, 600, () => img.remove());    
    a.appendChild(img);
  }
  if (item.also_in && item.also_in.length) {
    const c = el("div", "cites");
    c.appendChild(el("b", null, item.source));
    c.appendChild(document.createTextNode(" · " + item.also_in.join(" · ")));
    a.appendChild(c);
  } else {
    a.appendChild(el("span", "label", item.source));
  }
  const h = el("h3", null, item.title);
  a.appendChild(h);
  if (item.summary) a.appendChild(el("p", null, item.summary));
  // How much weight is behind this: how many newsrooms ran it, and whether
  // it matched a boost keyword. Shown so a thin lead is visibly thin.
  const bits = [];
  if (item.corroboration > 1) bits.push(item.corroboration + " outlets");
  if (item.boosted) bits.push("flagged");
  if (bits.length) a.appendChild(el("div", "weight", bits.join(" · ")));
  return a;
}

function rowCard(item, rich) {
  const a = linkTo(item, "row" + (rich ? " rich" : ""));
  if (rich) {
    // The box is added whether or not there's a picture — an empty slot
    // keeps the column straight, where a missing one lets the text jump
    // left and makes the section look broken.
    const thumb = el("div", "thumb");
    if (item.image) {
      const img = el("img");
      img.src = item.image;
      img.alt = "";
      img.loading = "lazy";
      guardImage(img, 160, () => img.remove());      
      thumb.appendChild(img);
    }
    a.appendChild(thumb);
  }
  const text = el("div", "rowtext");
  text.appendChild(el("span", "label", item.source));
  text.appendChild(el("h3", null, item.title));
  if (rich && item.summary) text.appendChild(el("p", "rowdek", item.summary));
  a.appendChild(text);
  return a;
}

function renderHeadlines(section) {
  const box = el("div", "stories");
  section.items.forEach((item, i) =>
    box.appendChild(i === 0 ? leadCard(item, section.lead_image)
                            : rowCard(item, section.row_detail)));
  return box;
}

// Line art at the same weight as the hairlines, so the icon reads as
// drawn rather than dropped in from an icon set.
const SKY = {
  sun: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.3M12 19.1v2.3M21.4 12h-2.3M4.9 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6L17 17M7 7L5.4 5.4"/>',
  partly: '<circle cx="8.5" cy="7.5" r="3"/><path d="M8.5 1.9v1.3M8.5 11.8v1.3M14.1 7.5h-1.3M4.2 7.5H2.9M12.5 3.5l-.9.9M5.4 10.6l-.9.9M12.5 11.5l-.9-.9M5.4 4.4l-.9-.9"/><path d="M9.6 20.4h7.3a3.1 3.1 0 0 0 .3-6.2 4.5 4.5 0 0 0-8.6-1 3.6 3.6 0 0 0 1 7.2z"/>',
  cloud: '<path d="M7 18.5h9.6a3.4 3.4 0 0 0 .3-6.8 5 5 0 0 0-9.5-1.1A3.9 3.9 0 0 0 7 18.5z"/>',
  rain: '<path d="M7 16.5h9.6a3.4 3.4 0 0 0 .3-6.8 5 5 0 0 0-9.5-1.1A3.9 3.9 0 0 0 7 16.5z"/><path d="M9 19.4l-.9 2.4M13 19.4l-.9 2.4M17 19.4l-.9 2.4"/>',
  snow: '<path d="M7 16.5h9.6a3.4 3.4 0 0 0 .3-6.8 5 5 0 0 0-9.5-1.1A3.9 3.9 0 0 0 7 16.5z"/><path d="M9 20h.01M13 20h.01M17 20h.01M11 22.2h.01M15 22.2h.01"/>',
  fog: '<path d="M7 14.5h9.6a3.4 3.4 0 0 0 .3-6.8 5 5 0 0 0-9.5-1.1A3.9 3.9 0 0 0 7 14.5z"/><path d="M5 18h14M7 21.2h10"/>',
  storm: '<path d="M7 15.5h9.6a3.4 3.4 0 0 0 .3-6.8 5 5 0 0 0-9.5-1.1A3.9 3.9 0 0 0 7 15.5z"/><path d="M13.2 17.4l-2.7 3.7h3.3L11.2 24"/>',
};

function renderAlmanac(section) {
  const w = section.items[0] || {};
  const box = el("div", "almanac");
  box.appendChild(el("div", "deg", w.temp + "°"));
  const say = el("p", "say");
  say.appendChild(el("span", "sayhi", w.phrase || ""));
  if (w.detail) say.appendChild(el("span", "saylo", w.detail));
  box.appendChild(say);
  return box;
}

const SOWING = {
  direct: '<path d="M3 18h18"/><circle cx="8" cy="9.5" r="1.3"/><circle cx="12" cy="6" r="1.3"/><circle cx="16" cy="9.5" r="1.3"/><path d="M8 12.2v2.4M12 8.7v5.9M16 12.2v2.4"/>',
  indoors: '<path d="M5.5 13.5h13l-1.4 6.5H6.9z"/><path d="M12 13.5V8"/><path d="M12 8.6c0-2 1.5-3.1 3.1-3.1M12 8.6c0-2-1.5-3.1-3.1-3.1"/>',
  out: '<path d="M3 19.5h18"/><path d="M12 19.5V11"/><path d="M12 11.6c0-2.1 1.6-3.3 3.3-3.3M12 11.6c0-2.1-1.6-3.3-3.3-3.3"/><path d="M9 19.5a3 3 0 0 1 6 0"/>',
};
const SOWING_LABEL = { direct: "Direct sow", indoors: "Start indoors", out: "Plant out" };

function renderGarden(section) {
  const w = section.items[0] || {};
  const box = el("div", "stories");

  box.appendChild(el("div", "kick", w.kicker));
  box.appendChild(el("h3", "task", w.title));
  if (w.summary) box.appendChild(el("p", "taskdek", w.summary));

  (w.plantings || []).forEach(p => {
    const row = el("div", "plantbox");
    const holder = el("div");
    holder.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">'
      + (SOWING[p.method] || SOWING.direct) + "</svg>";
    row.appendChild(holder.firstChild);
    const text = el("div");
    text.appendChild(el("div", "plabel", SOWING_LABEL[p.method] || p.method));
    text.appendChild(el("div", "crops", p.crops));
    row.appendChild(text);
    box.appendChild(row);
  });

  if ((w.reading || []).length) {
    const list = el("div", "reading");
    w.reading.forEach(r => {
      const a = el("a", "row");
      a.href = r.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.appendChild(el("span", "label", r.source));
      a.appendChild(el("h3", null, r.title));
      list.appendChild(a);
    });
    box.appendChild(list);
  }
  return box;
}

function renderGoods(section) {
  const wrap = el("div");
  const grid = el("div", "goods");
  section.items.forEach(item => {
    const card = linkTo(item, "good");
    if (item.image) {
      const frame = el("div", "frame");
      const img = el("img");
      img.src = item.image;
      img.alt = "";
      img.loading = "lazy";
      frame.appendChild(img);
      card.appendChild(frame);
    }
    card.appendChild(el("span", "label", item.source));
    card.appendChild(el("h3", null, item.title));
    if (item.price) card.appendChild(el("div", "price", item.price));
    grid.appendChild(card);
  });

  // An odd number of arrivals leaves a hole in a two-column grid. Fill it
  // with the way out rather than with a gap.
  if (section.items.length % 2 === 1) {
    const card = linkTo({ url: "all.html" }, "good filler");
    card.target = "_self";
    const frame = el("div", "frame");
    frame.appendChild(el("p", null, "Light load today."));
    frame.appendChild(el("span", null, "all releases →"));
    card.appendChild(frame);
    grid.appendChild(card);
  }

  wrap.appendChild(grid);
  if (section.more > 0) {
    wrap.appendChild(el("p", "empty", section.more + " more today."));
    const link = el("a", "more", "All releases →");
    link.href = "all.html";
    wrap.appendChild(link);
  }
  return wrap;
}

const RENDERERS = { headlines: renderHeadlines, goods: renderGoods, almanac: renderAlmanac, garden: renderGarden };
const WIDE = new Set();

function render(edition) {
  const built = new Date(edition.generated_at);
  const date = document.getElementById("date");
  date.appendChild(document.createTextNode(
    built.toLocaleDateString("en-US", { weekday: "long" }) + " "));
  date.appendChild(el("em", null,
    built.toLocaleDateString("en-US", { month: "long", day: "numeric" })));

  const total = edition.sections.reduce(
    (n, s) => n + (s.kind === "almanac" ? 0 : s.items.length), 0);

  // "New since you last read" only means something if we remember when
  // that was. This used to count anything published in the last four
  // days, which on a news page is nearly everything — it read 15 of 16.
  const KEY = "newsstand:lastRead";
  const since = Date.parse(localStorage.getItem(KEY) || "");
  const fresh = since
    ? edition.sections.reduce((n, s) => n + (s.kind === "almanac" ? 0
        : s.items.filter(i => Date.parse(i.first_seen) > since).length), 0)
    : 0;
  localStorage.setItem(KEY, new Date().toISOString());

  document.getElementById("tally").textContent =
    total + " items" + (fresh ? " · " + fresh + " new since you last read" : "");

  const main = document.getElementById("edition");
  const rule = document.getElementById("rule");

  edition.sections.forEach(section => {
    // A weather block that didn't answer should leave no trace, not a
    // stranded sentence sitting above the news.
    if (!section.items.length && section.kind === "almanac") return;
    const wrap = el("section", "section" + (WIDE.has(section.kind) ? " wide" : ""));
    wrap.id = "s-" + section.id;

    if (section.kind !== "almanac") {
      const head = el("div", "section-head");
      head.appendChild(el("span", null, section.title));
      wrap.appendChild(head);
    }

    if (!section.items.length && section.kind === "goods") {
      wrap.appendChild(el("p", "empty", "No new arrivals today."));
      const out = el("a", "more", "all releases →");
      out.href = "all.html";
      wrap.appendChild(out);
    } else if (!section.items.length) {
      wrap.appendChild(el("p", "empty", "Nothing came through here today."));
    } else {
      wrap.appendChild((RENDERERS[section.kind] || renderHeadlines)(section));
    }
    main.appendChild(wrap);

    const seg = el("a");
    seg.href = "#s-" + section.id;
    seg.title = section.title;
    seg.setAttribute("aria-label", section.title);
    seg.style.flex = Math.max(section.items.length, 1);
    rule.appendChild(seg);
  });

  if (edition.errors && edition.errors.length) {
    const det = el("details");
    det.appendChild(el("summary", null,
      `${edition.errors.length} source${edition.errors.length > 1 ? "s" : ""} didn't answer`));
    const list = el("ul");
    edition.errors.forEach(e => list.appendChild(el("li", null, e)));
    det.appendChild(list);
    document.getElementById("errors").appendChild(det);
  }

  trackReading();
}

function trackReading() {
  const sections = [...document.querySelectorAll(".section")];
  const segments = [...document.querySelectorAll(".edition-rule a")];
  const update = () => {
    const mark = window.scrollY + window.innerHeight * 0.34;
    sections.forEach((sec, i) => {
      const read = (mark - sec.offsetTop) / sec.offsetHeight;
      segments[i].style.setProperty("--read", Math.min(Math.max(read, 0), 1).toFixed(2));
    });
  };
  update();
  addEventListener("scroll", update, { passive: true });
  addEventListener("resize", update);
}

if (window.__EDITION__) {
  render(window.__EDITION__);
} else {
  fetch("data/feed.json").then(r => r.json()).then(render).catch(() => {
    document.getElementById("edition").innerHTML =
      '<p class="empty">No edition yet. It fills up on the next build.</p>';
  });
}
</script>
